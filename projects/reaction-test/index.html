<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reaction Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root {
  --bg: #fcfcfd; --surface: #ffffff; --fg: #111214; --muted: #696d76; --faint: #a2a5ad; --line: #e9eaee; --chip: #f3f4f6;
  --stop: #e5484d; --go: #12a150; --pad-ink: #ffffff;
  --sans: "Geist", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c0e; --surface: #131417; --fg: #f1f2f4; --muted: #a0a3ab; --faint: #6c7079; --line: #23252a; --chip: #1b1c20;
    --stop: #c9373d; --go: #138a47; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c0e; --surface: #131417; --fg: #f1f2f4; --muted: #a0a3ab; --faint: #6c7079; --line: #23252a; --chip: #1b1c20;
  --stop: #c9373d; --go: #138a47; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all;
  display: flex; flex-direction: column;
}
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  max-width: 760px; width: 100%; margin: 0 auto; padding: 18px 20px;
}
.back { color: var(--muted); text-decoration: none; font-size: .92rem; }
.back:hover { color: var(--fg); }
.bar h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; }
main {
  flex: 1; max-width: 760px; width: 100%; margin: 0 auto; padding: 4px 20px 36px;
  display: flex; flex-direction: column; gap: 16px;
}
.pad {
  flex: 1; min-height: 340px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 24px; text-align: center;
  border-radius: 18px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg);
  cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: background .1s;
}
.pad .big { font-size: clamp(2.2rem, 7vw, 3.6rem); font-weight: 600; letter-spacing: -0.04em; line-height: 1.1; }
.pad .small { color: var(--muted); font-size: .98rem; max-width: 26em; }
.pad.wait { background: var(--stop); border-color: var(--stop); color: var(--pad-ink); }
.pad.go { background: var(--go); border-color: var(--go); color: var(--pad-ink); }
.pad.wait .small, .pad.go .small { color: var(--pad-ink); opacity: .9; }
.pad.result .big, .pad.done .big { font-family: var(--mono); font-weight: 500; letter-spacing: -0.03em; }

.rounds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.round {
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; text-align: center;
  font: 400 .86rem var(--mono); color: var(--faint); background: var(--surface); font-variant-numeric: tabular-nums;
}
.round small { display: block; font: 400 .68rem var(--mono); text-transform: uppercase; letter-spacing: .04em; }
.round.filled { color: var(--fg); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 0; font-size: .9rem; color: var(--muted); }
.stats div { display: flex; align-items: baseline; gap: 8px; }
.stats dd { margin: 0; color: var(--fg); font: 500 .88rem var(--mono); }

.board { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px 10px; }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.board h2 { margin: 0; font-size: .95rem; font-weight: 600; letter-spacing: -0.01em; }
.board-note { font-size: .78rem; color: var(--faint); }
.board ol { list-style: none; margin: 0; padding: 0; }
.board li {
  display: grid; grid-template-columns: 2.2em 1fr auto; align-items: baseline; gap: 10px;
  padding: 8px 2px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.board li:first-child { border-top: 0; }
.board .rank { font: 500 .8rem var(--mono); color: var(--faint); }
.board .ms { font: 500 .95rem var(--mono); }
.board .date { font: 400 .76rem var(--mono); color: var(--faint); }
.board li.mine { background: var(--chip); border-radius: 8px; border-top-color: transparent; }
.board li.mine + li { border-top-color: transparent; }
.board li.mine .rank { color: var(--fg); }
.board li.empty { color: var(--faint); font-size: .86rem; display: block; }
@media (prefers-reduced-motion: reduce) { .pad { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../../index.html" id="back"></a>
  <h1 id="title"></h1>
</header>
<main>
  <div class="pad" id="pad" role="button" tabindex="0" aria-live="polite">
    <span class="big" id="big"></span>
    <span class="small" id="small"></span>
  </div>
  <div class="rounds" id="rounds"></div>
  <dl class="stats">
    <div><dt id="avgLabel"></dt><dd id="avg">–</dd></div>
    <div><dt id="bestLabel"></dt><dd id="best">–</dd></div>
  </dl>
  <section class="board" id="board" hidden>
    <div class="board-head">
      <h2 id="boardTitle"></h2>
      <span class="board-note" id="boardNote"></span>
    </div>
    <ol id="boardList"></ol>
  </section>
</main>
<script>
(function () {
  var lang = "ko";
  try { var s = localStorage.getItem("lang"); lang = s === "en" || s === "ko" ? s : (/^ko/i.test(navigator.language || "") ? "ko" : "en"); } catch (e) {}
  var TXT = {
    ko: {
      title: "반응속도 테스트", back: "← 프로젝트 목록", avg: "이번 평균", best: "내 최고 평균",
      start: "시작하기", startSub: "화면을 누르면 시작해요. 빨간색이 초록색으로 바뀌는 순간 누르세요. 스페이스바도 돼요.",
      wait: "기다리세요…", waitSub: "초록색이 되면 바로 누르세요", go: "지금!", goSub: "누르세요",
      early: "너무 빨라요", earlySub: "초록색이 된 다음에 눌러야 해요. 누르면 이 라운드를 다시 해요.",
      left: function (n) { return n + "번 남았어요. 누르면 다음 라운드예요."; },
      roundLabel: function (i) { return i + "회"; },
      again: " 누르면 다시 시작해요.", record: " · 최고 기록이에요!",
      grades: ["번개 같은 손이에요", "아주 빨라요", "좋아요", "평균이에요", "조금만 더 집중해 봐요"],
      boardTitle: "전체 랭킹 TOP 5", boardNote: "5회 평균 기준", empty: "아직 기록이 없어요. 첫 번째 기록을 남겨 보세요.",
      ranked: function (r) { return " · 전체 " + r + "위!"; }, saving: "기록 저장 중…", locale: "ko-KR"
    },
    en: {
      title: "Reaction Test", back: "← All projects", avg: "This run", best: "Best average",
      start: "Start", startSub: "Tap to begin. When red turns green, tap as fast as you can. Space bar works too.",
      wait: "Wait…", waitSub: "Tap the moment it turns green", go: "Now!", goSub: "Tap",
      early: "Too early", earlySub: "Wait for green. Tap to retry this round.",
      left: function (n) { return n + (n === 1 ? " round" : " rounds") + " left. Tap for the next one."; },
      roundLabel: function (i) { return "R" + i; },
      again: " Tap to play again.", record: " · New best!",
      grades: ["Lightning fast", "Very quick", "Nice", "About average", "Stay focused and try again"],
      boardTitle: "Top 5 leaderboard", boardNote: "5-round average", empty: "No records yet. Set the first one.",
      ranked: function (r) { return " · #" + r + " overall!"; }, saving: "Saving…", locale: "en-US"
    }
  }[lang];
  document.getElementById("boardTitle").textContent = TXT.boardTitle;
  document.getElementById("boardNote").textContent = TXT.boardNote;
  document.documentElement.lang = lang;
  document.title = TXT.title;
  document.getElementById("title").textContent = TXT.title;
  document.getElementById("back").textContent = TXT.back;
  document.getElementById("avgLabel").textContent = TXT.avg;
  document.getElementById("bestLabel").textContent = TXT.best;

  var ROUNDS = 5;
  var pad = document.getElementById("pad"), big = document.getElementById("big"), small = document.getElementById("small");
  var roundsEl = document.getElementById("rounds"), avgEl = document.getElementById("avg"), bestEl = document.getElementById("best");
  var state = "idle", times = [], timer = null, t0 = 0;
  var best = null;
  try { var b = parseFloat(localStorage.getItem("reaction-best")); if (b > 0) best = b; } catch (e) {}

  function grade(ms) { return TXT.grades[ms < 200 ? 0 : ms < 250 ? 1 : ms < 300 ? 2 : ms < 400 ? 3 : 4]; }
  function avg() { return times.reduce(function (a, b) { return a + b; }, 0) / times.length; }
  function show(cls, b, s) { pad.className = "pad " + cls; big.textContent = b; small.textContent = s; }
  function paintRounds() {
    var h = "";
    for (var i = 0; i < ROUNDS; i++) {
      var v = times[i];
      h += '<div class="round' + (v ? " filled" : "") + '"><small>' + TXT.roundLabel(i + 1) + "</small>" + (v ? Math.round(v) : "–") + "</div>";
    }
    roundsEl.innerHTML = h;
    avgEl.textContent = times.length ? Math.round(avg()) + " ms" : "–";
    bestEl.textContent = best ? Math.round(best) + " ms" : "–";
  }
  function startWait() {
    state = "wait";
    show("wait", TXT.wait, TXT.waitSub);
    timer = setTimeout(function () { state = "go"; t0 = performance.now(); show("go", TXT.go, TXT.goSub); }, 1200 + Math.random() * 2600);
  }
  function hit() {
    if (state === "idle" || state === "done") { times = []; paintRounds(); startWait(); return; }
    if (state === "wait") { clearTimeout(timer); state = "early"; show("idle", TXT.early, TXT.earlySub); return; }
    if (state === "early" || state === "result") { startWait(); return; }
    if (state === "go") {
      var ms = performance.now() - t0;
      // 100ms보다 빠르면 반응이 아니라 예측이에요 → 이 라운드를 다시 해요 (랭킹 서버도 이런 기록은 받지 않아요)
      if (ms < 100) { state = "early"; show("idle", TXT.early, TXT.earlySub); return; }
      times.push(ms); paintRounds();
      if (times.length >= ROUNDS) {
        var a = avg(), isBest = !best || a < best;
        if (isBest) { best = a; try { localStorage.setItem("reaction-best", String(a)); } catch (e) {} }
        paintRounds(); state = "done";
        var msg = grade(a) + (isBest ? TXT.record : "");
        var end = function (m) { return /[!.?]$/.test(m) ? m : m + "."; };
        show("done", Math.round(a) + " ms", end(msg) + TXT.again);
        submit(times.slice(), function (rank) {
          if (rank && state === "done") small.textContent = msg + TXT.ranked(rank) + TXT.again;
        });
      } else {
        state = "result";
        show("result", Math.round(times[times.length - 1]) + " ms", TXT.left(ROUNDS - times.length));
      }
    }
  }
  pad.addEventListener("pointerdown", function (e) { e.preventDefault(); hit(); });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("a")) return;
    if (e.code === "Space" || e.key === "Enter") { if (e.repeat) return; e.preventDefault(); hit(); }
  });
  /* ── 전체 랭킹 TOP 5 (이름 없이 기록만) ── */
  var API = "../../api/scores";
  var board = document.getElementById("board"), list = document.getElementById("boardList");
  var fmtDate = function (t) {
    try { return new Date(t).toLocaleDateString(TXT.locale, { month: "short", day: "numeric" }); } catch (e) { return ""; }
  };
  function paintBoard(top, mine) {
    if (!top.length) { list.innerHTML = '<li class="empty">' + TXT.empty + "</li>"; board.hidden = false; return; }
    list.innerHTML = top.map(function (r, i) {
      return '<li' + (mine === i + 1 ? ' class="mine"' : "") + '><span class="rank">' + (i + 1) + '</span><span class="ms">' +
        r.ms + ' ms</span><span class="date">' + (r.at ? fmtDate(r.at) : "") + "</span></li>";
    }).join("");
    board.hidden = false;
  }
  function loadBoard() {
    fetch(API, { cache: "no-store" }).then(function (r) { if (!r.ok) throw r.status; return r.json(); })
      .then(function (d) { paintBoard(d.top || []); })
      .catch(function () { board.hidden = true; });   // 랭킹 서버가 없으면 조용히 숨겨요
  }
  function submit(t, done) {
    fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ times: t.map(Math.round) }) })
      .then(function (r) { if (!r.ok) throw r.status; return r.json(); })
      .then(function (d) { paintBoard(d.top || [], d.rank); done(d.rank); })
      .catch(function () { loadBoard(); });
  }

  show("idle", TXT.start, TXT.startSub);
  paintRounds();
  loadBoard();
})();
</script>
</body>
</html>
